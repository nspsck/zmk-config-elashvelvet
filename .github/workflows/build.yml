name: Build ZMK firmware
on:
  workflow_dispatch:
  push:
    paths-ignore:
      - "keymap-drawer/**"

jobs:
  validate:
    name: Validate keymap before firmware build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Check both halves
        run: python3 scripts/check_keymap.py
      - name: Check keymap validation regressions
        run: python3 -B -m unittest discover -s tests -p 'test_keymap_check.py'

  build:
    needs: validate
    uses: cormoran/zmk/.github/workflows/build-user-config.yml@main+dya
